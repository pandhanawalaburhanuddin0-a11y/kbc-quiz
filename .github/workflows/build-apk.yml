name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.home }}/android-sdk
      ANDROID_HOME: ${{ runner.home }}/android-sdk
      PATH: ${{ runner.home }}/android-sdk/cmdline-tools/latest/bin:${{ runner.home }}/android-sdk/platform-tools:${{ env.PATH }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Android SDK command line tools
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip openjdk-17-jdk
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools.zip
        rm commandlinetools.zip
        mv cmdline-tools latest
        yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses
        sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-31" "platforms;android-37" "build-tools;31.0.0" "build-tools;37.0.0" "cmdline-tools;latest"

    - name: Verify Android SDK installation
      run: |
        ls -la $HOME/android-sdk/build-tools
        ls -la $HOME/android-sdk/platforms
        ls -la $HOME/android-sdk/cmdline-tools/latest/bin

    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Rename app file
      run: |
        if [ -f quiz_app.py ]; then mv quiz_app.py main.py; fi

    - name: Build APK
      run: |
        python -m buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
